<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="henBody" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#C47A3A"/>
      <stop offset="100%" stop-color="#8B4513"/>
    </radialGradient>
    <radialGradient id="egg" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="60%" stop-color="#F5E6C8"/>
      <stop offset="100%" stop-color="#D4A95A"/>
    </radialGradient>
    <radialGradient id="comb" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#E83030"/>
      <stop offset="100%" stop-color="#B22222"/>
    </radialGradient>
  </defs>

  <!-- Hen body -->
  <ellipse cx="256" cy="220" rx="130" ry="110" fill="url(#henBody)"/>

  <!-- Wing -->
  <ellipse cx="210" cy="230" rx="70" ry="55" fill="#A0522D" opacity="0.6"/>
  <ellipse cx="215" cy="225" rx="50" ry="38" fill="#8B4513" opacity="0.4"/>

  <!-- Tail feathers -->
  <path d="M130 180 Q90 120 70 160 Q50 200 110 210 Z" fill="#8B4513"/>
  <path d="M125 170 Q80 100 55 150 Q35 200 105 205 Z" fill="#A0522D"/>
  <path d="M120 190 Q85 130 65 170 Q50 210 108 215 Z" fill="#6B3410"/>

  <!-- Neck -->
  <ellipse cx="310" cy="170" rx="45" ry="55" fill="#C47A3A"/>

  <!-- Head -->
  <circle cx="330" cy="130" r="38" fill="#C47A3A"/>

  <!-- Comb -->
  <ellipse cx="330" cy="88" rx="18" ry="22" fill="url(#comb)"/>
  <circle cx="318" cy="92" r="12" fill="url(#comb)"/>
  <circle cx="342" cy="92" r="12" fill="url(#comb)"/>

  <!-- Eye -->
  <circle cx="342" cy="125" r="7" fill="#1a1a1a"/>
  <circle cx="344" cy="123" r="2.5" fill="white"/>

  <!-- Beak -->
  <polygon points="365,130 395,135 365,142" fill="#E8A020"/>
  <line x1="365" y1="136" x2="390" y2="136" stroke="#C4891A" stroke-width="1"/>

  <!-- Wattle -->
  <ellipse cx="362" cy="155" rx="10" ry="14" fill="#E83030"/>

  <!-- Feet -->
  <line x1="230" y1="325" x2="220" y2="380" stroke="#D4881A" stroke-width="5" stroke-linecap="round"/>
  <line x1="280" y1="325" x2="290" y2="380" stroke="#D4881A" stroke-width="5" stroke-linecap="round"/>
  <path d="M205 380 L220 380 L230 395 M220 380 L218 398 M225 380 L235 395" stroke="#D4881A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M275 380 L290 380 L300 395 M290 380 L288 398 M285 380 L295 395" stroke="#D4881A" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Eggs -->
  <ellipse cx="180" cy="400" rx="32" ry="40" fill="url(#egg)" stroke="#C49A4A" stroke-width="2"/>
  <ellipse cx="256" cy="410" rx="34" ry="42" fill="url(#egg)" stroke="#C49A4A" stroke-width="2"/>
  <ellipse cx="330" cy="400" rx="32" ry="40" fill="url(#egg)" stroke="#C49A4A" stroke-width="2"/>

  <!-- Egg highlights -->
  <ellipse cx="172" cy="388" rx="10" ry="14" fill="white" opacity="0.3"/>
  <ellipse cx="248" cy="398" rx="11" ry="15" fill="white" opacity="0.3"/>
  <ellipse cx="322" cy="388" rx="10" ry="14" fill="white" opacity="0.3"/>
</svg>
