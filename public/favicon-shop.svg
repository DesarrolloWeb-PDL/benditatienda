  <!-- Roof -->
  <path d="M80 230 L256 140 L432 230 Z" fill="#FF0000"/>
  <rect x="80" y="222" width="352" height="14" rx="4" fill="#CC0000"/>

  <!-- Awning stripes -->
  <rect x="100" y="200" width="44" height="30" rx="4" fill="#FF0000"/>
  <rect x="148" y="200" width="44" height="30" rx="4" fill="#FFFFFF"/>
  <rect x="196" y="200" width="44" height="30" rx="4" fill="#FF0000"/>
  <rect x="244" y="200" width="44" height="30" rx="4" fill="#FFFFFF"/>
  <rect x="292" y="200" width="44" height="30" rx="4" fill="#FF0000"/>
  <rect x="340" y="200" width="44" height="30" rx="4" fill="#FFFFFF"/>
  <rect x="388" y="200" width="24" height="30" rx="4" fill="#FF0000"/>

  <!-- Awning scallops -->
  <ellipse cx="122" cy="232" rx="22" ry="8" fill="#FF0000"/>
  <ellipse cx="170" cy="232" rx="22" ry="8" fill="#FFFFFF"/>
  <ellipse cx="218" cy="232" rx="22" ry="8" fill="#FF0000"/>
  <ellipse cx="266" cy="232" rx="22" ry="8" fill="#FFFFFF"/>
  <ellipse cx="314" cy="232" rx="22" ry="8" fill="#FF0000"/>
  <ellipse cx="362" cy="232" rx="22" ry="8" fill="#FFFFFF"/>
