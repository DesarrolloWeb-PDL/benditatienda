<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF0000"/>
      <stop offset="100%" stop-color="#CC0000"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>

  <!-- Store building -->
  <rect x="170" y="240" width="172" height="160" rx="8" fill="#FFFFFF" opacity="0.95"/>
  
  <!-- Store roof -->
  <path d="M140 250 L256 170 L372 250 Z" fill="#1A1A1A"/>
  <rect x="140" y="244" width="232" height="12" rx="4" fill="#1A1A1A"/>

  <!-- Store door -->
  <rect x="220" y="320" width="72" height="80" rx="6" fill="#1A1A1A"/>
  <circle cx="280" cy="360" r="6" fill="#FF0000"/>

  <!-- Store windows -->
  <rect x="182" y="270" width="50" height="40" rx="4" fill="#1A1A1A" opacity="0.8"/>
  <rect x="280" y="270" width="50" height="40" rx="4" fill="#1A1A1A" opacity="0.8"/>

  <!-- Left wing -->
  <path d="M256 200 C 230 180, 140 160, 80 130 C 120 170, 170 195, 220 210 C 190 185, 130 165, 90 155 C 140 195, 195 210, 235 218 Z" fill="#FFFFFF" opacity="0.95"/>
  
  <!-- Right wing -->
  <path d="M256 200 C 282 180, 372 160, 432 130 C 392 170, 342 195, 292 210 C 322 185, 382 165, 422 155 C 372 195, 317 210, 277 218 Z" fill="#FFFFFF" opacity="0.95"/>

  <!-- Wing detail lines -->
  <path d="M256 205 C 235 190, 160 175, 110 155" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M256 205 C 277 190, 352 175, 402 155" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.5"/>
</svg>
