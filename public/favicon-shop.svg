  <circle cx="280" cy="390" r="6" fill="#FF0000"/>

  <!-- Windows -->
  <rect x="130" y="270" width="70" height="55" rx="6" fill="#1A1A1A"/>
  <rect x="312" y="270" width="70" height="55" rx="6" fill="#1A1A1A"/>

  <!-- Window reflections -->
  <line x1="135" y1="275" x2="155" y2="295" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
  <line x1="140" y1="275" x2="160" y2="295" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
  <line x1="317" y1="275" x2="337" y2="295" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
  <line x1="322" y1="275" x2="342" y2="295" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>

  <!-- Left wing inside wall -->
  <path d="M200 310 C 180 295, 140 285, 115 275 C 135 300, 165 315, 195 320 C 170 300, 135 290, 120 285 C 145 310, 175 320, 200 325 Z" fill="#FFFFFF" opacity="0.9"/>

